services:
  mongo:
    image: mongo:7
    container_name: techcup-notifications-db
    ports:
      # 27019 en el host para no chocar con los otros servicios del workspace
      # (que usan 27017/27018); el contenedor de la app usa el puerto interno
      # 27017 vía la red de docker.
      - "27019:27017"
    volumes:
      - techcup-notifications-mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-notifications:
    build: .
    container_name: techcup-notifications-app
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/techcup_notifications
      SERVER_PORT: 8083
      INTERNAL_API_KEY: local-dev-internal-key
      ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
    ports:
      - "8083:8083"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      # Puerto de host configurable: si se levantan varios servicios de astromerge
      # a la vez (matches/notifications/logistics), cada uno usa un puerto distinto
      # para no chocar, igual que ya se hace con el puerto de Mongo.
      - "${PROMETHEUS_PORT:-9091}:9090"

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "${ZIPKIN_PORT:-9412}:9411"

volumes:
  techcup-notifications-mongodata:
