services:
  postgres:
    image: postgres:16
    container_name: techcup-notifications-db
    environment:
      POSTGRES_DB: techcup_notifications
      POSTGRES_PASSWORD: postgres
    ports:
      # 5433 en el host para no chocar con otro Postgres local en 5432; el
      # contenedor de la app usa el puerto interno 5432 vía la red de docker.
      - "5433:5432"
    volumes:
      - techcup-notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  service-notifications:
    build: .
    container_name: techcup-notifications-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: techcup_notifications
      DB_USER: postgres
      DB_PASSWORD: postgres
      SERVER_PORT: 8083
      INTERNAL_API_KEY: local-dev-internal-key
    ports:
      - "8083:8083"

volumes:
  techcup-notifications-data:
