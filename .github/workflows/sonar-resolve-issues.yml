name: Sonar - Resolve reviewed issues (one-off)

on:
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Marcar como Won't Fix los issues ya revisados manualmente
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          set -e

          resolve_issue() {
            local issue_key="$1"
            local comment_file="$2"

            echo "Comentando y resolviendo $issue_key..."
            curl -sf -X POST "$SONAR_HOST_URL/api/issues/add_comment" \
              -H "Authorization: Bearer $SONAR_TOKEN" \
              --data-urlencode "issue=$issue_key" \
              --data-urlencode "text@$comment_file" > /dev/null

            curl -sf -X POST "$SONAR_HOST_URL/api/issues/do_transition" \
              -H "Authorization: Bearer $SONAR_TOKEN" \
              --data-urlencode "issue=$issue_key" \
              --data-urlencode "transition=wontfix"
            echo "$issue_key resuelto."
          }

          cat > /tmp/comment-s3330.txt <<'EOF'
          HttpOnly=false es intencional: el token CSRF debe ser legible por JavaScript
          para reenviarlo en el header X-XSRF-TOKEN, siguiendo el patron oficial de
          Spring Security para SPAs stateless (CookieCsrfTokenRepository).
          EOF

          cat > /tmp/comment-s4502.txt <<'EOF'
          CSRF esta activo y es real para los endpoints de usuario (PATCH /leer,
          PATCH /leer-todas), verificado con tests dedicados. Se exime unicamente a
          los webhooks servicio-a-servicio (autenticados con X-Internal-Api-Key), que
          nunca los origina un navegador y no pueden obtener la cookie CSRF -
          exigirles un token rompería la integracion real con los microservicios que
          consumen estos endpoints.
          EOF

          resolve_issue "AZ9rrUT8pUzf_Ekqapa-" "/tmp/comment-s3330.txt"
          resolve_issue "AZ9rrUT8pUzf_Ekqapa9" "/tmp/comment-s4502.txt"
