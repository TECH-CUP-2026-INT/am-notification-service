spring:
  application:
    name: service-notifications

  autoconfigure:
    # La autenticación real la resuelve JwtClaimsFilter a partir del JWT del Gateway
    # (o InternalApiKeyFilter para llamadas servicio-a-servicio); no usamos el
    # UserDetailsService/usuario en memoria por defecto de Spring Security.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/techcup_notifications}
      auto-index-creation: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # CloudAMQP compartido por todo el ecosistema TechCup (mismo broker que usan
  # Torneos y Estadísticas). RABBITMQ_PASS nunca debe quedar en este archivo:
  # solo se define como variable de entorno / secreto de despliegue.
  rabbitmq:
    host: toucan.lmq.cloudamqp.com
    port: 5671
    username: exdntvvm
    password: ${RABBITMQ_PASS:}
    virtual-host: exdntvvm
    ssl:
      enabled: true

server:
  port: ${SERVER_PORT:8083}

techcup:
  security:
    internal:
      # Compartida con los servicios que publican eventos hacia nosotros
      # (Sanciones, Comunicaciones, Equipos, Inscripción, Agendamiento).
      api-key: ${INTERNAL_API_KEY:local-dev-internal-key}

  email:
    from: ${MAIL_FROM:no-reply@techcup.com}
    # TODO: reemplazar por una consulta real al Servicio de Usuarios (p. ej. GET
    # /usuarios/{id}) una vez que exponga el correo del destinatario — hoy ningún
    # servicio del org expone esa consulta. Mientras tanto, si se define esta
    # variable, TODAS las notificaciones envían su correo a esta única dirección
    # (útil para probar el envío real end-to-end en desarrollo); si se deja vacía,
    # el envío de correo se omite (se sigue creando la notificación in-app igual).
    test-recipient: ${NOTIFICATION_TEST_EMAIL:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  metrics:
    tags:
      application: ${spring.application.name}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING:1.0}

logging:
  level:
    co.edu.escuelaing.techcup.notifications: INFO
