spring:
  application:
    name: service-notifications

  autoconfigure:
    # La autenticación real la resuelve JwtClaimsFilter a partir del JWT del Gateway
    # (o InternalApiKeyFilter para llamadas servicio-a-servicio); no usamos el
    # UserDetailsService/usuario en memoria por defecto de Spring Security.
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:techcup_notifications}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: ${SERVER_PORT:8083}

techcup:
  security:
    internal:
      # Compartida con los servicios que publican eventos hacia nosotros
      # (Sanciones, Comunicaciones, Equipos, Inscripción, Agendamiento).
      api-key: ${INTERNAL_API_KEY:local-dev-internal-key}
